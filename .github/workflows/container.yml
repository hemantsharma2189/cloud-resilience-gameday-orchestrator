name: Container Build and Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Build and Scan Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gameday-orchestrator:test

      - name: Test dry-run container
        run: |
          docker run --rm gameday-orchestrator:test \
            scenarios/pod-crash-dry-run.yaml

      - name: Scan container for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gameday-orchestrator:test
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
