[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-resilience-gameday-orchestrator"
version = "0.1.0"
description = "Automated Kubernetes failure simulation, recovery validation, SLO measurement and incident reporting platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.7,<15.0",
  "kubernetes>=30.1,<35.0",
  "prometheus-client>=0.20,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0"
]

[project.scripts]
gameday = "gameday.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
